<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog spot of a hopeful romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Butterfly+Kids&family=Griffy&family=Buda&family=Purple+Purse&family=Ruge+Boogie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header>
      <h1>blog spot of a hopeful romantic</h1>
      <p>a space curated to be an archive of my rawest form of self</p>
    </header>

    <div class="content-wrapper">
      
      <!-- MAIN BLOG POSTS -->
      <main id="posts-container">
        <!-- Posts from posts.json will appear here automatically -->
      </main>

      <!-- SIDEBAR WIDGETS -->
      <aside>

        <!-- Banner Widget -->
        <a href="#" class="btn-banner">welcome to my space!</a>

        <!-- Cbox / Chatbox Widget Embed -->
        <div class="widget">
          <h3>Chatbox</h3>
          <!-- Replace this iframe src with your actual Cbox embed URL from cbox.ws -->
          <iframe src="https://my.cbox.ws/hopefulromantic" width="100%" height="250" frameborder="0" scrolling="auto"></iframe>
        </div>

        <!-- Song of The Day Widget -->
        <div class="widget">
          <h3>Song of The Day</h3>
          <iframe 
            id="spotify-player"
            style="border-radius:12px" 
            src="https://open.spotify.com/embed/track/6w2rrJsn8Qpa7veSaVAyKh?utm_source=generator" 
            width="100%" 
            height="152" 
            frameborder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
          </iframe>
        </div>

        <!-- Interests Widget -->
        <div class="widget">
          <h3>Interests</h3>
          <ul>
            <li>volleyball, communications, coding, speech pathology, self-rebrand</li>
          </ul>
        </div>

        <!-- Contact Form Widget -->
        <div class="widget">
          <h3>Write me!</h3>
          <form class="contact-form" action="https://formspree.io/f/mvzepvbo" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" rows="3" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
          </form>
        </div>

        <!-- Labels Widget -->
        <div class="widget">
        <h3>Labels</h3>
        <ul id="labels-list">
          <!-- JavaScript will automatically insert labels here -->
        </ul>
      </div>

      </aside>

    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const postsContainer = document.getElementById("posts-container");
    const labelsList = document.getElementById("labels-list");
    const spotifyPlayer = document.getElementById("spotify-player");

    fetch("posts.json")
      .then(response => response.json())
      .then(data => {
        // 1. Update Spotify Player track automatically if present in JSON
        if (data.spotifyTrackId && spotifyPlayer) {
          spotifyPlayer.src = `https://open.spotify.com/embed/track/${data.spotifyTrackId}?utm_source=generator`;
        }

        // 2. Render Blog Posts
        const posts = data.posts || [];
        postsContainer.innerHTML = "";
        const allTags = new Set();

        posts.forEach(post => {
          if (post.tags) {
            post.tags.split(",").forEach(tag => allTags.add(tag.trim()));
          }

          const postElement = document.createElement("article");
          postElement.className = "post";
          postElement.setAttribute("data-tags", post.tags || "");

          postElement.innerHTML = `
            <div class="post-date">${post.date}</div>
            <h2>${post.title}</h2>
            <p>${post.content}</p>
            <div class="post-footer">
              Posted at ${post.time} | <a href="#" class="tag">${post.tags}</a>
            </div>
          `;

          postsContainer.appendChild(postElement);
        });

        // 3. Build Labels widget automatically
        if (labelsList) {
          labelsList.innerHTML = '<li><a href="#" data-filter="all">all</a></li>';
          allTags.forEach(tag => {
            labelsList.innerHTML += `<li><a href="#" data-filter="${tag}">${tag}</a></li>`;
          });

          labelsList.addEventListener("click", function (e) {
            if (e.target.tagName === "A") {
              e.preventDefault();
              const selectedTag = e.target.getAttribute("data-filter");
              const renderedPosts = document.querySelectorAll("article.post");

              renderedPosts.forEach(post => {
                const postTags = post.getAttribute("data-tags") 
                  ? post.getAttribute("data-tags").split(",").map(t => t.trim()) 
                  : [];

                if (selectedTag === "all" || postTags.includes(selectedTag)) {
                  post.style.display = "block";
                } else {
                  post.style.display = "none";
                }
              });
            }
          });
        }
      })
      .catch(error => console.error("Error loading JSON data:", error));
  });
  </script>

</body>
</html>
