<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog spot of a hopeful romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Buda:wght@300&family=Butterfly+Kids&family=Griffy&family=Purple+Purse&family=Ruge+Boogie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header>
      <h1>blog spot of a hopeful romantic</h1>
      <p><!-- blog description --></p>
    </header>

    <!-- FLOATING NAVIGATION BAR -->
    <nav class="blog-nav">
      <a href="index.html" class="nav-link">blog</a>
      <a href="about.html" class="nav-link">about</a>
      <a href="gallery.html" class="nav-link">gallery</a>
      <a href="creations.html" class="nav-link">creations</a>
      <a href="lists.html" class="nav-link">lists</a>
    </nav>

    <!-- 3-COLUMN LAYOUT WRAPPER -->
    <div class="content-wrapper">
      
      <!-- LEFT SIDEBAR -->
      <aside class="sidebar-left">
        <iframe 
          data-testid="embed-iframe" 
          style="border-radius:12px" 
          src="https://open.spotify.com/embed/playlist/3acLZze2hmeSQP9ghQXsfB?utm_source=generator&si=184b89d3e1dc49b6" 
          width="100%" 
          height="352" 
          frameBorder="0" 
          allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
          loading="lazy">
        </iframe>

        <iframe 
          src="https://hopefulromantic.github.io/countdown/" 
          class="widget-countdown"
          frameborder="0"
          scrolling="no">
        </iframe>
      </aside>

      <!-- MAIN BLOG POSTS -->
      <main id="main-content">
        <div id="posts-container">
          <!-- Posts from posts.json load here -->
        </div>
      </main>

      <!-- RIGHT SIDEBAR WIDGETS -->
      <aside class="sidebar">
        <a href="#" class="banner-button">welcome to my space!</a>

        <div class="widget widget-chatbox">
          <h3>Chatbox</h3>
          <iframe src="https://my.cbox.ws/hopefulromantic" width="100%" height="250" frameborder="0" scrolling="auto"></iframe>
        </div>
        
        <div class="widget widget-labels">
          <h3>Labels</h3>
          <ul id="labels-list"></ul>
        </div>

        <div class="widget widget-interests">
          <h3>Interests</h3>
          <ul>
            <li>volleyball, communications, coding, speech pathology, self-rebrand</li>
          </ul>
        </div>

        <div class="widget widget-contact">
          <h3>Write me!</h3>
          <form class="contact-form" action="https://formspree.io/f/mvzepvbo" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" rows="3" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
          </form>
        </div>
      </aside>

    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const postsContainer = document.getElementById("posts-container");
    const labelsList = document.getElementById("labels-list");

    fetch("posts.json")
      .then(response => response.json())
      .then(data => {
        const posts = data.posts || [];
        postsContainer.innerHTML = "";
        const allTags = new Set();

        posts.forEach(post => {
          if (post.tags) {
            post.tags.split(",").forEach(tag => allTags.add(tag.trim()));
          }

          const postElement = document.createElement("article");
          postElement.className = "post";
          postElement.setAttribute("data-tags", post.tags || "");

          postElement.innerHTML = `
            <div class="post-date">${post.date}</div>
            <h2>${post.title}</h2>
            <p>${post.content}</p>
            <div class="post-footer">
              Posted at ${post.time} | <a href="#" class="tag">${post.tags}</a>
            </div>
          `;

          postsContainer.appendChild(postElement);
        });

        if (labelsList) {
          labelsList.innerHTML = '<li><a href="#" data-filter="all">all</a></li>';
          allTags.forEach(tag => {
            labelsList.innerHTML += `<li><a href="#" data-filter="${tag}">${tag}</a></li>`;
          });

          labelsList.addEventListener("click", function (e) {
            if (e.target.tagName === "A") {
              e.preventDefault();
              const selectedTag = e.target.getAttribute("data-filter");
              const renderedPosts = document.querySelectorAll("article.post");

              renderedPosts.forEach(post => {
                const postTags = post.getAttribute("data-tags") 
                  ? post.getAttribute("data-tags").split(",").map(t => t.trim()) 
                  : [];

                if (selectedTag === "all" || postTags.includes(selectedTag)) {
                  post.style.display = "block";
                } else {
                  post.style.display = "none";
                }
              });
            }
          });
        }
      })
      .catch(error => console.error("Error loading JSON data:", error));
  });
  </script>

</body>
</html>
